<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio Js Finale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light" onload="init()">
    <div class="container">
        <h1 class="my-5">Users</h1>
        <form class="mb-3 row" onsubmit="searchByName();return false">
            <div class="col-10">
                <input type="text" class="form-control form-control-sm" id="searchInputText" placeholder="Filter user">
            </div>
            <div class="col-2">
                <button type="submit" class="btn btn-primary btn-sm w-100">Submit</button>
            </div>
        </form>

        <table class="table table-hover table-striped mt-4">
            <thead>
                <tr id="tableHeaderRow">
                    <th><span id="lastName" onclick="sort('lastName')"><span>Last Name</span> <i class="bi bi-sort-alpha-down bi-display-yes"></i></span></th>
                    <th><span id="firstName" onclick="sort('firstName')"><span>First Name</span> <i class="bi bi-sort-alpha-down"></i></span></th>
                    <th><span id="gender" onclick="sort('gender')"><span>Gender</span> <i class="bi bi-sort-alpha-down"></i></span></th>
                    <th><span id="age" onclick="sort('age')"><span>Age</span> <i class="bi bi-sort-numeric-down"></i></span></th>
                    <th><span id="height" onclick="sort('height')"><span>Height</span> <i class="bi bi-sort-numeric-down"></i></span></th>
                    <th><span id="weight" onclick="sort('weight')"><span>Weight</span> <i class="bi bi-sort-numeric-down"></i></span></th>
                    <th><span id="eyeColor" onclick="sort('eyeColor')"><span>Eye Color</span> <i class="bi bi-sort-alpha-down"></i></span></th>
                    <th><span id="hair"><span>Hair</span> <i class="bi bi-sort-alpha-down"></i></span></th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td>Johnson</td>
                    <td>Emily</td>
                    <td>F</td>
                    <td>29</td>
                    <td>193.24</td>
                    <td>63.16</td>
                    <td>Green</td>
                    <td>Curly Brown</td>
                </tr>
                <tr>
                    <td>Williams</td>
                    <td>Michael</td>
                    <td>M</td>
                    <td>36</td>
                    <td>186.22</td>
                    <td>76.32</td>
                    <td>Red</td>
                    <td>Straight Green</td>
                </tr>                
            </tbody>
        </table>
        <nav class="d-flex justify-content-center">
            <ul class="pagination" id="pagination">
                <li class="page-item"><a class="page-link">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
